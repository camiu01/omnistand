name: Build & Verify Omni-Stand

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Run the bundler script to generate omni-stand_merged.scad
      - name: Run distribution build
        run: |
          python build.py

      # Step 4: Ensure omni-stand_merged.scad was created and check repository status
      - name: Verify generated file
        run: |
          test -f omni-stand_merged.scad || (echo "omni-stand_merged.scad was not generated!" && exit 1)

      # Step 5: Upload the merged standalone SCAD file as an artifact
      - name: Upload merged SCAD artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-stand_merged
          path: omni-stand_merged.scad
